[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "widget-optimade-client"
version = "0.2.0"
description = "A Jupyter widget for querying OPTIMADE-compatible providers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["traitlets>=5.0", "anywidget>=0.2", "ipywidgets>=8"]

[project.optional-dependencies]
aiidalab = ["ase>=3.22", "numpy"]

[tool.hatch.build]
ignore-vcs = true


[tool.hatch.build.targets.wheel]
packages = ["optimadewidget"]
include = [
    "optimadewidget/widget-dist/*.js",
    "optimadewidget/widget-dist/*.css"
]
# ignore-vcs (needed to ship the gitignored widget-dist/) also stops hatch from
# skipping node_modules etc., so list the sdist contents explicitly.
[tool.hatch.build.targets.sdist]
include = ["/optimadewidget", "/tests", "/README.md"]
exclude = ["__pycache__"]
